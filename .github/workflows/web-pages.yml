name: Zalagren Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate web surface
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          grep -q '<link rel="stylesheet" href="styles.css">' web/index.html
          grep -q '<script src="app.js"></script>' web/index.html
          grep -q 'Zalagren' web/index.html
          grep -q 'CONSTANTYNA' web/index.html
          grep -q 'GENESIS' web/index.html
          grep -q 'BeatPay' web/index.html
          grep -q 'TSAVO' web/index.html
          grep -q 'Mi Vida' web/index.html
          grep -q 'Qwetu' web/index.html

      - name: Validate no fabricated deployment claims
        run: |
          ! grep -RniE 'fake success|payment successful|booking confirmed|provider connected' web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
