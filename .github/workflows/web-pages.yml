name: Zalagren Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zalagren-web-platform
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: zalagren-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate web surface
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          grep -q '<link rel="stylesheet" href="styles.css">' web/index.html
          grep -q '<script src="app.js"></script>' web/index.html
          grep -Rqi 'Zalagren' web
          grep -Rqi 'CONSTANTYNA' web
          grep -Rqi 'GENESIS' web
          grep -Rqi 'BeatPay' web
          grep -Rqi 'TSAVO' web
          grep -Rqi 'Mi Vida' web
          grep -Rqi 'Qwetu' web
          grep -Rqi 'EXECUTION GATE\|Create proposal' web/app.js

      - name: Validate no fabricated deployment claims
        run: |
          ! grep -RniE 'fake success|payment successful|booking confirmed|provider connected' web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL" | grep -qi "Zalagren"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL/app.js" | grep -qi "EXECUTION GATE"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL/manifest.webmanifest" | grep -qi "Zalagren"
