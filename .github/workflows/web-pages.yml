name: Zalagren Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zalagren-web-platform
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: zalagren-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate web surface
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          grep -q '<link rel="stylesheet" href="styles.css">' web/index.html
          grep -q '<script src="app.js"></script>' web/index.html
          grep -Rqi 'Zalagren' web
          grep -Rqi 'CONSTANTYNA' web
          grep -Rqi 'GENESIS' web
          grep -Rqi 'BeatPay' web
          grep -Rqi 'TSAVO' web
          grep -Rqi 'Mi Vida' web
          grep -Rqi 'Qwetu' web
          grep -q 'pushState' web/app.js
          grep -q 'popstate' web/app.js
          grep -q 'history.forward' web/app.js
          grep -q 'safe-area-inset-bottom' web/styles.css
          grep -q 'foundationPage' web/app.js
          grep -q 'securityPage' web/app.js
          grep -q 'ecosystemPage' web/app.js
          grep -q 'assets/IMG_1505.png' web/app.js
          grep -q 'assets/IMG_1507.png' web/app.js
          grep -q 'assets/IMG_1508.png' web/app.js
          grep -q 'assets/IMG_1509.png' web/app.js
          grep -q 'assets/IMG_1505.png' web/app.js
          grep -q 'function settings()' web/app.js
          node --check web/app.js
          grep -q 'assets/IMG_1510.png' web/app.js
          test -f docs/WEB-ARTWORK-MAP.md

      - name: Validate no fabricated deployment claims
        run: |
          ! grep -RniE 'fake success|payment successful|booking confirmed|provider connected' web

      - name: Install image processing dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Inspect uploaded images
        run: |
          sudo apt-get install -y -qq tesseract-ocr
          for src in IMG_1505.jpeg IMG_1506.jpeg IMG_1507.jpeg IMG_1508.jpeg IMG_1509.jpeg IMG_1510.jpeg; do
            echo "===== $src ====="
            identify "$src"
            tesseract "$src" stdout 2>/dev/null || true
          done

      - name: Prepare uploaded image assets
        run: |
          mkdir -p web/assets
          # IMG_1505 is the canonical Zalagren logo. Keep the original JPEG untouched;
          # only the deployed derivative gets its connected background made transparent.
          convert IMG_1505.jpeg -alpha on -fuzz 8% -fill none -draw "color 0,0 floodfill" -strip web/assets/IMG_1505.png

          # Other uploaded artwork may use the transparent derivative pipeline.
          for src in IMG_1506.jpeg IMG_1507.jpeg IMG_1508.jpeg IMG_1509.jpeg IMG_1510.jpeg; do
            test -f "$src"
            base="$(basename "$src" .jpeg)"
            convert "$src" -alpha on -fuzz 8% -fill none -draw "color 0,0 floodfill" "web/assets/${base}.png"
          done
          test "$(find web/assets -name '*.png' | wc -l)" -eq 6

      - name: Validate prepared assets
        run: |
          file web/assets/*.png
          identify -format '%f %wx%h %[channels]\n' web/assets/*.png | tee /tmp/assets.txt
          grep -q 'srgba' /tmp/assets.txt
          opaque="$(identify -format '%[opaque]' web/assets/IMG_1505.png | tr '[:upper:]' '[:lower:]')"
          test "$opaque" = 'false'
          alpha_min="$(convert web/assets/IMG_1505.png -alpha extract -format '%[min]' info:)"
          test "$alpha_min" = '0'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL" | grep -qi "Zalagren"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL/app.js" | grep -qi "popstate"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL/styles.css" | grep -qi "safe-area-inset-bottom"
          curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL/manifest.webmanifest" | grep -qi "Zalagren"
          for asset in IMG_1505 IMG_1506 IMG_1507 IMG_1508 IMG_1509 IMG_1510; do
            curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL/assets/$asset.png" -o /tmp/$asset.png
            test -s /tmp/$asset.png
          done
