name: Royal City iOS Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: royal-city-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec Zalagren.xcodegen.yml

      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -project Zalagren.xcodeproj \
            -scheme Zalagren \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone device archive
        working-directory: ios
        run: |
          xcodebuild \
            -project Zalagren.xcodeproj \
            -scheme Zalagren \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Zalagren.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify device archive
        working-directory: ios
        run: |
          app_path=build/Zalagren.xcarchive/Products/Applications/Zalagren.app
          test -d "$app_path"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Info.plist" | grep -qx 'Royal City'
